<style>

<div id="app"><div style="display:flex;align-items:center;justify-content:center;min-height:100vh;flex-direction:column;gap:14px;color:#d4a843;font-size:15px"><span class="spin" style="font-size:40px">⛳</span>Verbinde...</div></div>

<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import{getFirestore,doc,collection,setDoc,getDoc,onSnapshot,addDoc,serverTimestamp,query,orderBy}from"https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

const fb=initializeApp({apiKey:"AIzaSyCn42Sz5SOuv5PMvkpG7tEi788-jxNicAg",authDomain:"jga2026nico.firebaseapp.com",projectId:"jga2026nico",storageBucket:"jga2026nico.firebasestorage.app",messagingSenderId:"530783593771",appId:"1:530783593771:web:3678d6029dfbd2cc1c916e"});
const db=getFirestore(fb);

// ─── CONSTANTS ────────────────────────────────────────────────────────────
const G='#d4a843',BG='#08120a',BOR='#1a2e1a',CARD='rgba(255,255,255,.03)';
const RED='#d45a5a',BLUE='#5a7ad4';
const PC=['#d4a843','#e8c460','#c8923a','#a06820','#5b8fd4','#7ab0e8','#4a70b8','#3a5898','#9a6ad4'];
const SI=[1,10,3,12,5,14,7,16,9,2,11,4,13,6,15,8,17,18];
const COURSES=[
  {name:'Beckenbauer Golf Course',cr:73.1,slope:127,par:[4,4,5,3,4,4,3,5,4,5,4,5,4,3,4,4,3,4]},
  {name:'Porsche Golf Course',cr:71.1,slope:129,par:[4,4,3,4,5,4,3,4,4,4,4,3,5,4,4,3,4,5]},
  {name:'Lederbach (Axel Lange)',cr:70.8,slope:133,par:[4,3,5,4,4,3,5,4,4,4,3,5,4,3,4,3,5,4]},
  {name:'Brunnwies',cr:70.9,slope:132,par:[4,4,3,4,4,3,5,4,4,4,3,4,3,5,4,3,4,5]},
  {name:'Uttlau (St. Wolfgang)',cr:71.9,slope:136,par:[4,5,4,3,4,4,4,5,3,4,3,5,4,3,4,5,3,5]},
  {name:'Manuell',cr:72.0,slope:125,par:[4,4,3,5,4,3,4,5,4,4,3,5,4,4,3,4,4,5]},
];
const FL={single:'👤 Einzel',matchplay:'⚔️ Match Play',fourball:'🏌️ Four-Ball',greensomes:'🔄 Greensomes'};
const TAGS=['⛳ Birdie','🦅 Eagle','😂 Lustig','😬 Desaster','🍺 Prost','🏆 Moment'];

// ─── MATH ─────────────────────────────────────────────────────────────────
function vorgabe(hcp,cr,sr,pars){return Math.round(hcp*(sr/113)+(cr-pars.reduce((a,b)=>a+b,0)));}
function hs(v,h){const a=Math.abs(v),s=v>=0?1:-1;return (SI[h]<=Math.floor(a)?1:0)*s+(SI[h]===1&&a>Math.floor(a)?s:0);}
function stb(s,par,rec){return s>0?Math.max(0,par-(s-rec)+2):0;}
function dc(o){return JSON.parse(JSON.stringify(o));}

// ─── FIREBASE REFS ────────────────────────────────────────────────────────
const settRef=doc(db,'jga2026','settings');
const teamCfgRef=doc(db,'jga2026','teamConfig'); // team assignments (fixed, changeable)
const rndsRef=(n)=>doc(db,'jga2026-rounds',`round${n}`);
const teamOvRef=doc(db,'jga2026','teamOverall');
const chatCol=collection(db,'jga2026-chat');

// ─── STATE ────────────────────────────────────────────────────────────────
let tab='round';
let screen='setup'; // setup | game | results

// Settings
let sett={
  numPlayers:8,
  players:[
    {name:'Bräutigam 🤵',hcp:18},{name:'Mirco',hcp:18},{name:'Christoph',hcp:18},{name:'David',hcp:18},
    {name:'Kevin',hcp:18},{name:'Janis',hcp:18},{name:'Yannic',hcp:18},{name:'Johannes',hcp:18},
    {name:'Janek',hcp:18}
  ]
};

// Team config – fixed assignment, changeable per round
// For matchplay: flights[i] = {red: playerIdx, blue: playerIdx} (4 flights)
// For fourball/greensomes: flights[i] = {red:[pi,pi], blue:[pi,pi]} (2 flights)
let teamCfg={
  matchplay:{flights:[
    {red:0,blue:4},{red:1,blue:5},{red:2,blue:6},{red:3,blue:7}
  ]},
  fourball:{flights:[
    {red:[0,1],blue:[4,5]},{red:[2,3],blue:[6,7]}
  ]},
  greensomes:{flights:[
    {red:[0,1],blue:[4,5]},{red:[2,3],blue:[6,7]}
  ]}
};

// Current round
let RD={
  roundNum:1,format:'single',countForEinzel:true,
  courseName:COURSES[0].name,cr:COURSES[0].cr,sr:COURSES[0].slope,pars:COURSES[0].par.slice(),
  scores:Array.from({length:9},()=>Array(18).fill(0)),
  greenScores:{}, // {flightIdx: {red:[18], blue:[18]}}
  finalized:false,
};

// All saved rounds
let allRounds={};
// Team overall
let teamOv={red:0,blue:0,matches:[]};
// Chat
let chatMsgs=[];
let myName=localStorage.getItem('jga-name')||'';

// UI
let curHole=0;
let curFlight=0;
let cpOpen=false;
let showTeamSetup=false; // overlay
let teamSetupMode=''; // which format we're configuring
let selTag='';
let chatImg=null;

// ─── SAVE ─────────────────────────────────────────────────────────────────
async function saveSett(){try{await setDoc(settRef,sett);}catch(e){console.error(e);}}
async function saveTeamCfg(){try{await setDoc(teamCfgRef,teamCfg);}catch(e){console.error(e);}}
async function saveRound(){try{await setDoc(rndsRef(RD.roundNum),RD);}catch(e){console.error(e);}}
async function saveTeamOv(){try{await setDoc(teamOvRef,teamOv);}catch(e){console.error(e);}}

// ─── LISTENERS ────────────────────────────────────────────────────────────
onSnapshot(settRef,s=>{if(s.exists())Object.assign(sett,s.data());render();});
onSnapshot(teamCfgRef,s=>{if(s.exists())Object.assign(teamCfg,s.data());render();});
onSnapshot(teamOvRef,s=>{if(s.exists())Object.assign(teamOv,s.data());render();});
onSnapshot(rndsRef(1),s=>{if(s.exists()&&RD.roundNum===1){mergeRound(s.data());render();}});
onSnapshot(rndsRef(2),s=>{if(s.exists()&&RD.roundNum===2){mergeRound(s.data());render();}});
onSnapshot(rndsRef(3),s=>{if(s.exists()&&RD.roundNum===3){mergeRound(s.data());render();}});
onSnapshot(rndsRef(4),s=>{if(s.exists()&&RD.roundNum===4){mergeRound(s.data());render();}});
onSnapshot(rndsRef(5),s=>{if(s.exists()&&RD.roundNum===5){mergeRound(s.data());render();}});
onSnapshot(query(chatCol,orderBy('ts','asc')),s=>{
  chatMsgs=s.docs.map(d=>({id:d.id,...d.data()}));
  render();
  setTimeout(()=>{const el=document.getElementById('cf');if(el)el.scrollTop=el.scrollHeight;},50);
});

function mergeRound(data){
  // Only merge from Firebase, don't overwrite local edits in progress
  Object.assign(RD,data);
}

// ─── HELPERS ──────────────────────────────────────────────────────────────
function players(){return sett.players.slice(0,sett.numPlayers);}
function pname(pi){return sett.players[pi]?.name||'?';}
function pcolor(pi){return PC[pi]||G;}
function pshort(pi){return pname(pi).split(' ')[0].slice(0,8);}
function getV(pi){return vorgabe(sett.players[pi]?.hcp||18,RD.cr,RD.sr,RD.pars);}
function getStb(pi){return RD.scores[pi].reduce((s,sc,h)=>s+(sc>0?stb(sc,RD.pars[h],hs(getV(pi),h)):0),0);}
function getGross(pi){return RD.scores[pi].reduce((a,s)=>a+(s||0),0);}
function getHoles(pi){return RD.scores[pi].filter(s=>s>0).length;}

// Flights for current format
function getFlights(){
  const n=sett.numPlayers;
  if(n<=4)return [[0,1,2,3].slice(0,n)];
  if(n<=6)return [[0,1,2],[3,4,5]];
  if(n<=8)return [[0,1,2,3],[4,5,6,7]];
  return [[0,1,2],[3,4,5],[6,7,8]];
}
function getTeamFlights(fmt){
  const f=fmt||RD.format;
  if(f==='matchplay'){
    return (teamCfg.matchplay?.flights||[]).map(fl=>({red:[fl.red],blue:[fl.blue]}));
  } else {
    const key=f==='fourball'?'fourball':'greensomes';
    return (teamCfg[key]?.flights||[]).map(fl=>({red:fl.red||[],blue:fl.blue||[]}));
  }
}

// ─── MATCH CALCULATIONS ───────────────────────────────────────────────────
function calcMatch1v1(rPi,bPi){
  let up=0,played=0;const res=[];
  for(let h=0;h<18;h++){
    const rs=RD.scores[rPi][h],bs=RD.scores[bPi][h];
    if(!rs||!bs){res.push(null);continue;}
    played++;
    const rn=rs-hs(getV(rPi),h),bn=bs-hs(getV(bPi),h);
    if(rn<bn){up++;res.push('red');}else if(bn<rn){up--;res.push('blue');}else res.push('half');
  }
  return{up,remaining:18-played,played,res,won:Math.abs(up)>18-played};
}
function bestNet(pis,h){
  let best=null;
  for(const pi of pis){const s=RD.scores[pi][h];if(!s)continue;const n=s-hs(getV(pi),h);if(best===null||n<best)best=n;}
  return best;
}
function calcMatchTeam(rPis,bPis){
  let up=0,played=0;const res=[];
  for(let h=0;h<18;h++){
    const r=bestNet(rPis,h),b=bestNet(bPis,h);
    if(r===null||b===null){res.push(null);continue;}
    played++;
    if(r<b){up++;res.push('red');}else if(b<r){up--;res.push('blue');}else res.push('half');
  }
  return{up,remaining:18-played,played,res,won:Math.abs(up)>18-played};
}
function calcGreenMatch(fi){
  const gs=RD.greenScores?.[fi];
  if(!gs)return{up:0,remaining:18,played:0,res:[],won:false};
  const tf=getTeamFlights()[fi]||{red:[],blue:[]};
  const rV=tf.red.reduce((s,pi)=>s+getV(pi),0)/Math.max(tf.red.length,1);
  const bV=tf.blue.reduce((s,pi)=>s+getV(pi),0)/Math.max(tf.blue.length,1);
  let up=0,played=0;const res=[];
  for(let h=0;h<18;h++){
    const rs=gs.red?.[h],bs=gs.blue?.[h];
    if(!rs||!bs){res.push(null);continue;}
    played++;
    const rn=rs-Math.round(hs(rV,h)),bn=bs-Math.round(hs(bV,h));
    if(rn<bn){up++;res.push('red');}else if(bn<rn){up--;res.push('blue');}else res.push('half');
  }
  return{up,remaining:18-played,played,res,won:Math.abs(up)>18-played};
}
function matchStat(fmt,fi){
  const tf=getTeamFlights(fmt)[fi]||{red:[],blue:[]};
  if(fmt==='matchplay') return calcMatch1v1(tf.red[0],tf.blue[0]);
  if(fmt==='fourball') return calcMatchTeam(tf.red,tf.blue);
  return calcGreenMatch(fi);
}
function matchBar(stat,rName,bName){
  const up=stat.up,rem=stat.remaining,won=stat.won;
  let txt,col;
  if(up===0){txt='All Square';col='#6a8a6a';}
  else{const abs=Math.abs(up),n=up>0?rName:bName;col=up>0?RED:BLUE;txt=won?`${n} ${abs}&${rem}`:`${n} ${abs} UP`;}
  const dots=stat.res.map(r=>`<span style="display:inline-block;width:9px;height:9px;border-radius:50%;background:${r===null?'#1a2e1a':r==='red'?RED:r==='blue'?BLUE:'#4a6a4a'}"></span>`).join('');
  return `<div style="background:rgba(0,0,0,.3);border-radius:10px;padding:9px 11px;margin-bottom:8px">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:5px">
      <span style="font-size:12px;color:${RED};font-weight:700">🔴 ${rName}</span>
      <span style="font-size:13px;font-weight:700;color:${col};text-align:center;flex:1">${txt}</span>
      <span style="font-size:12px;color:${BLUE};font-weight:700">${bName} 🔵</span>
    </div>
    <div style="display:flex;gap:3px;flex-wrap:wrap">${dots}</div>
    <div style="font-size:9px;color:#4a6a4a;margin-top:3px;text-align:center">${stat.played} gespielt · ${rem} verbleibend</div>
  </div>`;
}

// ─── RENDER ───────────────────────────────────────────────────────────────
function render(){
  document.getElementById('app').innerHTML=buildPage();
  attachEvents();
}

function buildPage(){
  const tabs=[['round','⛳','Runde'],['einzel','👤','Einzel'],['team','🔴','Team'],['chat','💬','Chat']];
  const nav=`<nav class="nav">${tabs.map(([t,ic,l])=>`<button class="nb${tab===t?' on':''}" id="nav-${t}"><span class="ic">${ic}</span>${l}</button>`).join('')}</nav>`;
  let content='';
  if(tab==='round')content=screen==='setup'?buildSetup():screen==='game'?buildGame():buildResults();
  else if(tab==='einzel')content=buildEinzel();
  else if(tab==='team')content=buildTeam();
  else content=buildChat();
  const overlay=showTeamSetup?buildTeamSetupOverlay():'';
  return `<div class="fade">${content}</div>${overlay}${nav}`;
}

// ─── HERO ─────────────────────────────────────────────────────────────────
function hero(sub){
  return `<div style="background:linear-gradient(180deg,#0f2a10,#08120a);padding:18px 20px 12px;text-align:center;border-bottom:1px solid ${BOR}">
    <div style="font-size:32px">⛳</div>
    <h1 style="margin:4px 0 2px;font-size:19px;font-weight:400;letter-spacing:5px;color:${G};text-transform:uppercase">JGA Golf 2026</h1>
    <p style="margin:0;font-size:9px;color:#4a6a4a;letter-spacing:2px">${sub||''}</p>
    <div style="width:40px;height:1px;background:linear-gradient(90deg,transparent,${G},transparent);margin:7px auto 0"></div>
  </div>`;
}

// ─── SETUP ────────────────────────────────────────────────────────────────
function buildSetup(){
  const n=sett.numPlayers;
  const course=COURSES.find(c=>c.name===RD.courseName)||COURSES[0];
  const isTeam=RD.format!=='single';

  const rndBtns=[1,2,3,4,5].map(r=>`<button id="sr-${r}" style="flex:1;padding:8px 0;border:2px solid ${RD.roundNum===r?G:BOR};border-radius:8px;background:${RD.roundNum===r?'rgba(212,168,67,.12)':'#0c180c'};color:${RD.roundNum===r?G:'#4a6a4a'};font-family:inherit;font-size:12px;font-weight:${RD.roundNum===r?700:400};cursor:pointer">${r}</button>`).join('');

  const fmtBtns=[['single','👤','Einzel'],['matchplay','⚔️','Match Play'],['fourball','🏌️','Four-Ball'],['greensomes','🔄','Greensomes']].map(([f,ic,l])=>`<button id="fmt-${f}" style="flex:1;padding:9px 3px;border:2px solid ${RD.format===f?G:BOR};border-radius:9px;background:${RD.format===f?'rgba(212,168,67,.10)':'#0c180c'};color:${RD.format===f?G:'#4a6a4a'};font-family:inherit;font-size:10px;font-weight:${RD.format===f?700:400};cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px"><span style="font-size:16px">${ic}</span>${l}</button>`).join('');

  const npBtns=[8,9].map(np=>`<button id="np-${np}" style="flex:1;padding:9px;border:2px solid ${n===np?G:BOR};border-radius:8px;background:${n===np?'rgba(212,168,67,.10)':'#0c180c'};color:${n===np?G:'#4a6a4a'};font-family:inherit;font-size:13px;font-weight:${n===np?700:400};cursor:pointer">${np} Spieler</button>`).join('');

  const playerRows=Array.from({length:n},(_,i)=>`<div style="display:flex;gap:7px;align-items:center;margin-bottom:7px">
    <div style="width:8px;height:8px;border-radius:50%;background:${PC[i]};flex-shrink:0"></div>
    <input id="pn-${i}" type="text" value="${sett.players[i]?.name||''}" style="flex:1;background:#0a140a;border:1px solid ${BOR};border-radius:6px;color:#d8d0c0;padding:5px 7px;font-family:inherit;font-size:12px;outline:none;min-width:0">
    <div style="display:flex;align-items:center;gap:4px;flex-shrink:0">
      <span style="font-size:8px;color:#4a6a4a">HCP</span>
      <input id="ph-${i}" type="text" inputmode="decimal" value="${sett.players[i]?.hcp||18}" style="width:44px;height:28px;text-align:center;font-size:12px;font-weight:700;border:2px solid ${BOR};border-radius:6px;background:#0c180c;color:#e8e0d0;outline:none">
    </div>
  </div>`).join('');

  // Show current team assignment summary
  let teamSummary='';
  if(isTeam){
    const tf=getTeamFlights();
    teamSummary=`<div style="background:rgba(212,168,67,.07);border:1px solid ${G}33;border-radius:10px;padding:10px 12px;margin-bottom:12px">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">
        <div style="font-size:10px;color:${G};font-weight:700">Teams & Flights</div>
        <button id="edit-teams" style="background:rgba(212,168,67,.15);border:1px solid ${G};border-radius:6px;color:${G};font-size:10px;padding:3px 9px;cursor:pointer;font-family:inherit">✏️ Bearbeiten</button>
      </div>
      ${tf.map((f,fi)=>`<div style="margin-bottom:5px;font-size:11px">
        <span style="color:#4a6a4a">Flight ${fi+1}:</span>
        <span style="color:${RED};margin-left:6px">🔴 ${f.red.map(pi=>pshort(pi)).join(' & ')}</span>
        <span style="color:#4a6a4a;margin:0 4px">vs</span>
        <span style="color:${BLUE}">${f.blue.map(pi=>pshort(pi)).join(' & ')} 🔵</span>
      </div>`).join('')}
    </div>`;
  }

  const cpFilt=cpOpen?COURSES.filter(c=>c.name.toLowerCase().includes('')):'';
  const cpList=cpOpen?`<div style="background:#0c180c;border:1px solid ${BOR};border-radius:10px;overflow:hidden;margin-top:6px">
    <div style="max-height:180px;overflow-y:auto">
      ${COURSES.map((c,i)=>`<button id="cp-${i}" style="width:100%;text-align:left;padding:8px 12px;background:${RD.courseName===c.name?'rgba(212,168,67,.10)':'transparent'};border:none;border-bottom:1px solid #0f1e0f;cursor:pointer;font-family:inherit;display:block">
        <div style="font-size:12px;color:${RD.courseName===c.name?G:'#d8d0c0'};font-weight:${RD.courseName===c.name?700:400}">${c.name}</div>
        <div style="font-size:9px;color:#4a6a4a">CR ${c.cr} · Slope ${c.slope} · Par ${c.par.reduce((a,b)=>a+b,0)}</div>
      </button>`).join('')}
    </div>
  </div>`:'';

  const chkEinzel=`<div style="display:flex;align-items:center;gap:10px;margin-bottom:14px">
    <button id="chk-e" style="width:26px;height:26px;border-radius:6px;border:2px solid ${RD.countForEinzel?G:BOR};background:${RD.countForEinzel?'rgba(212,168,67,.15)':'transparent'};color:${RD.countForEinzel?G:'#4a6a4a'};font-size:14px;cursor:pointer;font-family:inherit">${RD.countForEinzel?'✓':''}</button>
    <span style="font-size:12px;color:#8a9a7a">Zählt zur <strong style="color:#d8d0c0">Einzelwertung</strong></span>
  </div>`;

  return `${hero('RUNDEN-SETUP')}
  <div class="fade" style="max-width:540px;margin:0 auto;padding:14px 13px 20px">

    <div style="background:rgba(91,143,212,.07);border:1px solid #1a2e4a;border-radius:9px;padding:8px 12px;margin-bottom:14px;display:flex;align-items:center;gap:8px">
      <span>🔴</span><div style="font-size:10px;color:#5b8fd4;font-weight:700">Live-Sync aktiv – alle Scores geteilt</div>
    </div>

    <div style="margin-bottom:14px">
      <div class="lbl">Runde</div>
      <div style="display:flex;gap:5px">${rndBtns}</div>
    </div>

    <div style="margin-bottom:14px">
      <div class="lbl">Spielformat</div>
      <div style="display:flex;gap:5px">${fmtBtns}</div>
    </div>

    ${chkEinzel}

    <div style="margin-bottom:14px">
      <div class="lbl">Spieler (${n})</div>
      <div style="display:flex;gap:8px;margin-bottom:10px">${npBtns}</div>
      ${playerRows}
    </div>

    ${teamSummary}

    <div style="margin-bottom:14px">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">
        <div class="lbl" style="margin:0">Golfplatz</div>
        <button id="cp-tog" style="background:rgba(212,168,67,.10);border:1px solid ${G};border-radius:6px;color:${G};font-size:10px;padding:4px 9px;cursor:pointer;font-family:inherit">${cpOpen?'✕':'Wechseln'}</button>
      </div>
      <div style="background:rgba(212,168,67,.07);border:1px solid #2a3e1a;border-radius:10px;padding:9px 12px">
        <div style="font-size:14px;color:${G};font-weight:700">${RD.courseName}</div>
        <div style="display:flex;gap:12px;margin-top:4px;font-size:11px;color:#8a9a7a">
          <span>CR <strong style="color:#d8d0c0">${RD.cr.toFixed(1)}</strong></span>
          <span>Slope <strong style="color:#d8d0c0">${RD.sr}</strong></span>
          <span>Par <strong style="color:#d8d0c0">${RD.pars.reduce((a,b)=>a+b,0)}</strong></span>
        </div>
      </div>
      ${cpList}
    </div>

    <button id="start-btn" style="width:100%;padding:15px;background:linear-gradient(135deg,${G},#a07830);border:none;border-radius:12px;color:#050d05;font-size:16px;font-family:inherit;font-weight:700;letter-spacing:2px;cursor:pointer">⛳ Runde starten</button>
  </div>`;
}

// ─── TEAM SETUP OVERLAY ───────────────────────────────────────────────────
function buildTeamSetupOverlay(){
  const fmt=teamSetupMode||RD.format;
  const n=sett.numPlayers;
  const isMP=fmt==='matchplay';

  if(isMP){
    // Match Play: 4 flights, drag/assign 1 red vs 1 blue per flight
    const cfg=teamCfg.matchplay||{flights:[{red:0,blue:4},{red:1,blue:5},{red:2,blue:6},{red:3,blue:7}]};
    const flights=cfg.flights.slice(0,4);
    const assignedR=new Set(flights.map(f=>f.red));
    const assignedB=new Set(flights.map(f=>f.blue));
    const unassigned=Array.from({length:n},(_,i)=>i).filter(i=>!assignedR.has(i)&&!assignedB.has(i));

    const flightRows=flights.map((fl,fi)=>`<div style="background:rgba(0,0,0,.3);border-radius:10px;padding:10px;margin-bottom:8px">
      <div style="font-size:10px;color:${G};margin-bottom:8px;letter-spacing:2px">FLIGHT ${fi+1}</div>
      <div style="display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:center">
        <select id="mp-r-${fi}" style="background:#0c180c;border:1px solid ${RED}55;border-radius:7px;color:${RED};padding:7px;font-family:inherit;font-size:12px;font-weight:700">
          ${Array.from({length:n},(_,i)=>`<option value="${i}"${fl.red===i?' selected':''}>${pname(i)}</option>`).join('')}
        </select>
        <span style="color:#4a6a4a;font-size:11px">vs</span>
        <select id="mp-b-${fi}" style="background:#0c180c;border:1px solid ${BLUE}55;border-radius:7px;color:${BLUE};padding:7px;font-family:inherit;font-size:12px;font-weight:700">
          ${Array.from({length:n},(_,i)=>`<option value="${i}"${fl.blue===i?' selected':''}>${pname(i)}</option>`).join('')}
        </select>
      </div>
    </div>`).join('');

    return `<div class="overlay"><div class="sheet">
      <div style="font-size:9px;color:${G};letter-spacing:4px;margin-bottom:14px">⚔️ MATCH PLAY – FLIGHTS EINSTELLEN</div>
      <div style="font-size:11px;color:#4a6a4a;margin-bottom:12px">4 Flights · je 1 Rot vs 1 Blau</div>
      ${flightRows}
      <div style="display:flex;gap:8px;margin-top:14px">
        <button id="ts-cancel" style="flex:1;padding:12px;background:#0c180c;border:1px solid ${BOR};border-radius:10px;color:#8a9a7a;font-family:inherit;cursor:pointer">Abbrechen</button>
        <button id="ts-save-mp" style="flex:2;padding:12px;background:linear-gradient(135deg,${G},#a07830);border:none;border-radius:10px;color:#050d05;font-weight:700;font-family:inherit;cursor:pointer">✓ Speichern</button>
      </div>
    </div></div>`;
  } else {
    // Four-Ball / Greensomes: 2 flights, 2 red + 2 blue per flight
    const key=fmt==='fourball'?'fourball':'greensomes';
    const cfg=teamCfg[key]||{flights:[{red:[0,1],blue:[4,5]},{red:[2,3],blue:[6,7]}]};
    const flights=cfg.flights.slice(0,2);

    const flightRows=flights.map((fl,fi)=>`<div style="background:rgba(0,0,0,.3);border-radius:10px;padding:10px;margin-bottom:8px">
      <div style="font-size:10px;color:${G};margin-bottom:8px;letter-spacing:2px">FLIGHT ${fi+1}</div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">
        <div>
          <div style="font-size:9px;color:${RED};margin-bottom:5px">🔴 ROT (2 Spieler)</div>
          ${[0,1].map(si=>`<select id="fb-r-${fi}-${si}" style="width:100%;background:#0c180c;border:1px solid ${RED}55;border-radius:7px;color:${RED};padding:6px;font-family:inherit;font-size:11px;margin-bottom:4px">
            ${Array.from({length:n},(_,i)=>`<option value="${i}"${(fl.red||[])[si]===i?' selected':''}>${pname(i)}</option>`).join('')}
          </select>`).join('')}
        </div>
        <div>
          <div style="font-size:9px;color:${BLUE};margin-bottom:5px">🔵 BLAU (2 Spieler)</div>
          ${[0,1].map(si=>`<select id="fb-b-${fi}-${si}" style="width:100%;background:#0c180c;border:1px solid ${BLUE}55;border-radius:7px;color:${BLUE};padding:6px;font-family:inherit;font-size:11px;margin-bottom:4px">
            ${Array.from({length:n},(_,i)=>`<option value="${i}"${(fl.blue||[])[si]===i?' selected':''}>${pname(i)}</option>`).join('')}
          </select>`).join('')}
        </div>
      </div>
    </div>`).join('');

    return `<div class="overlay"><div class="sheet">
      <div style="font-size:9px;color:${G};letter-spacing:4px;margin-bottom:14px">${fmt==='fourball'?'🏌️ FOUR-BALL':'🔄 GREENSOMES'} – FLIGHTS EINSTELLEN</div>
      <div style="font-size:11px;color:#4a6a4a;margin-bottom:12px">2 Flights · je 2 Rot + 2 Blau</div>
      ${flightRows}
      <div style="display:flex;gap:8px;margin-top:14px">
        <button id="ts-cancel" style="flex:1;padding:12px;background:#0c180c;border:1px solid ${BOR};border-radius:10px;color:#8a9a7a;font-family:inherit;cursor:pointer">Abbrechen</button>
        <button id="ts-save-fb" data-fmt="${key}" style="flex:2;padding:12px;background:linear-gradient(135deg,${G},#a07830);border:none;border-radius:10px;color:#050d05;font-weight:700;font-family:inherit;cursor:pointer">✓ Speichern</button>
      </div>
    </div></div>`;
  }
}

// ─── GAME SCREEN ──────────────────────────────────────────────────────────
function buildGame(){
  const fmt=RD.format;
  const isTeam=fmt!=='single';
  const flights=getFlights();
  const af=Math.min(curFlight,flights.length-1);
  const flight=flights[af];
  const holePar=RD.pars[curHole];
  const teamFlights=isTeam?getTeamFlights():[];

  // Flight tabs
  const flightTabs=flights.length>1?`<div style="display:flex;border-top:1px solid ${BOR}">
    ${flights.map((f,fi)=>`<button id="ft-${fi}" style="flex:1;padding:7px 2px;border:none;background:${af===fi?'rgba(212,168,67,.12)':'transparent'};color:${af===fi?G:'#4a6a4a'};font-size:10px;font-weight:${af===fi?700:400};border-bottom:2px solid ${af===fi?G:'transparent'};cursor:pointer;font-family:inherit">Flight ${fi+1}</button>`).join('')}
  </div>`:'';

  // Match bar for current flight (team formats)
  let mBar='';
  if(isTeam&&teamFlights.length>0){
    const tf=teamFlights[Math.min(af,teamFlights.length-1)];
    if(tf&&tf.red.length&&tf.blue.length){
      const stat=matchStat(fmt,Math.min(af,teamFlights.length-1));
      const rN=tf.red.map(pi=>pshort(pi)).join('/');
      const bN=tf.blue.map(pi=>pshort(pi)).join('/');
      mBar=matchBar(stat,rN,bN);
    }
  }

  // Score cards – ALL players in flight get input
  let cards='';
  if(fmt==='greensomes'&&teamFlights.length>0){
    const fi2=Math.min(af,teamFlights.length-1);
    const tf=teamFlights[fi2];
    if(!RD.greenScores)RD.greenScores={};
    if(!RD.greenScores[fi2])RD.greenScores[fi2]={red:Array(18).fill(0),blue:Array(18).fill(0)};
    const gs=RD.greenScores[fi2];
    ['red','blue'].forEach(team=>{
      const pis=tf[team]||[];
      const s=gs[team]?.[curHole]||0;
      const avgV=pis.reduce((sum,pi)=>sum+getV(pi),0)/Math.max(pis.length,1);
      const rec=Math.round(hs(avgV,curHole));
      const net=s>0?s-rec:null;
      const diff=s>0?s-holePar:null;
      const tcol=team==='red'?RED:BLUE;
      const names=pis.map(pi=>pname(pi)).join(' + ');
      const qBtns=[1,2,3,4,5,6,7,8,9].map(qv=>`<button id="gs-${team}-${qv}" style="flex:1;height:36px;border-radius:6px;border:2px solid ${s===qv?tcol:BOR};background:${s===qv?tcol+'33':'#0c180c'};color:${s===qv?tcol:'#5a7a5a'};font-size:12px;font-weight:700;cursor:pointer;font-family:inherit">${qv}</button>`).join('');
      const statR=s>0?`<div style="display:flex;gap:10px;margin-top:7px;padding-top:7px;border-top:1px solid #0f1e0f;align-items:center">
        <span style="font-size:11px;color:#4a6a4a">Netto <strong style="color:#aaa">${net}</strong></span>
        <span style="font-size:11px;font-weight:700;color:${diff<0?'#5aaf7a':diff===0?'#6a8a6a':'#d45a5a'}">${diff<=-2?'🦅':diff===-1?'🐦':diff===0?'Par':diff===1?'Bogey':'+'+diff}</span>
      </div>`:'';
      cards+=`<div class="card" style="border:1px solid ${s>0?tcol+'55':BOR};border-left:4px solid ${tcol}">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:7px">
          <div style="font-size:13px;font-weight:700;color:${tcol}">${team==='red'?'🔴':'🔵'} ${names}</div>
          <div style="font-size:12px;font-weight:700;color:#5a8a5a">Par ${holePar}</div>
        </div>
        <div style="font-size:9px;color:#3a5a3a;margin-bottom:7px">Gemeinsamer Score · Ø Vorgabe ${avgV.toFixed(1)} · ${rec>0?'+'+rec+' Extra':'kein Extra'}</div>
        <div style="display:flex;gap:2px">${qBtns}</div>
        ${statR}
      </div>`;
    });
  } else {
    cards=flight.map(pi=>{
      const s=RD.scores[pi][curHole];
      const v=getV(pi);const rec=hs(v,curHole);
      const pts=s>0?stb(s,holePar,rec):null;
      const net=s>0?s-rec:null;
      const diff=s>0?s-holePar:null;
      const pcol=PC[pi];
      // Find this player's team
      const team=isTeam?(()=>{const tf2=teamFlights[Math.min(af,teamFlights.length-1)];if(!tf2)return null;if(tf2.red.includes(pi))return 'red';if(tf2.blue.includes(pi))return 'blue';return null;})():null;
      const tcol=team==='red'?RED:team==='blue'?BLUE:null;
      // Best ball indicator for fourball
      let bbNote='';
      if(fmt==='fourball'&&team&&s>0){
        const tf2=teamFlights[Math.min(af,teamFlights.length-1)];
        const teamPis=tf2?tf2[team]:[];
        const isBest=teamPis.every(p2=>{if(p2===pi)return true;const s2=RD.scores[p2][curHole];if(!s2)return true;return net<=(s2-hs(getV(p2),curHole));});
        if(isBest&&teamPis.length>1)bbNote=`<span style="font-size:9px;background:${tcol||pcol}22;color:${tcol||pcol};border-radius:4px;padding:1px 5px">🏌️ Best Ball</span>`;
      }
      const qBtns=[1,2,3,4,5,6,7,8,9].map(qv=>`<button id="q-${pi}-${qv}" style="flex:1;height:36px;border-radius:6px;border:2px solid ${s===qv?pcol:BOR};background:${s===qv?pcol+'33':'#0c180c'};color:${s===qv?pcol:'#5a7a5a'};font-size:12px;font-weight:700;cursor:pointer;font-family:inherit">${qv}</button>`).join('');
      const statR=s>0?`<div style="display:flex;gap:8px;margin-top:7px;padding-top:7px;border-top:1px solid #0f1e0f;flex-wrap:wrap;align-items:center">
        ${fmt!=='matchplay'?`<span style="font-size:11px;color:${pts>=3?'#5b8fd4':pts>=2?'#5aaf7a':pts===1?G:'#d45a5a'}">⭐ ${pts} Pkt</span>`:''}
        <span style="font-size:11px;color:#4a6a4a">Netto <strong style="color:#aaa">${net}</strong></span>
        <span style="font-size:11px;font-weight:700;color:${diff<0?'#5aaf7a':diff===0?'#6a8a6a':'#d45a5a'}">${diff<=-2?'🦅':diff===-1?'🐦':diff===0?'Par':diff===1?'Bogey':'+'+diff}</span>
        ${bbNote}
      </div>`:'';
      return `<div class="card" style="border:1px solid ${s>0?pcol+'55':BOR};border-left:4px solid ${pcol}${tcol?';border-right:3px solid '+tcol:''}">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:7px">
          <div style="display:flex;align-items:center;gap:7px">
            <span style="font-size:14px;font-weight:700;color:${pcol}">${pname(pi)}</span>
            <span style="font-size:12px;font-weight:700;color:#5a8a5a">Par ${holePar}</span>
          </div>
          <div style="font-size:9px;color:#3a5a3a">Vorgabe ${v} · ${rec>0?'+'+rec+' Extra':rec<0?rec+' Schl.':'kein Extra'}</div>
        </div>
        <div style="display:flex;gap:2px">${qBtns}</div>
        ${statR}
      </div>`;
    }).join('');
  }

  // Hole grid
  const hGrid=(s,e,lbl)=>`<div style="margin-bottom:7px">
    <div style="font-size:8px;color:#4a6a4a;letter-spacing:2px;margin-bottom:3px">${lbl}</div>
    <div style="display:flex;gap:2px">
      ${Array.from({length:e-s},(_,i)=>{const h=s+i;const da=flight.every(pi=>RD.scores[pi][h]>0);const ds=flight.some(pi=>RD.scores[pi][h]>0);const cur=h===curHole;
        return `<button id="hd-${h}" style="flex:1;display:flex;flex-direction:column;align-items:center;gap:1px;padding:5px 1px;border-radius:6px;border:2px solid ${cur?G:da?'#3a5a3a':ds?'#2a4a2a':'#1a2e1a'};background:${cur?'rgba(212,168,67,.18)':da?'rgba(90,175,122,.10)':ds?'rgba(90,175,122,.05)':'transparent'};cursor:pointer;font-family:inherit">
          <span style="font-size:11px;font-weight:700;color:${cur?G:da?'#5aaf7a':ds?'#4a8a4a':'#4a5a4a'}">${h+1}</span>
          <span style="font-size:10px;font-weight:700;color:#5a7a5a">P${RD.pars[h]}</span>
          <span style="width:6px;height:6px;border-radius:50%;background:${da?G:ds?'#5aaf7a':'transparent'};display:block"></span>
        </button>`;
      }).join('')}
    </div>
  </div>`;

  // Live ranking / match overview bottom
  const bottomSection=isTeam?
    `<div style="font-size:8px;color:${G};letter-spacing:3px;margin-bottom:7px;text-transform:uppercase">Alle Matches – Überblick</div>
    ${teamFlights.filter(tf=>tf.red.length&&tf.blue.length).map((tf,fi)=>{
      const stat=matchStat(fmt,fi);
      return matchBar(stat,tf.red.map(pi=>pshort(pi)).join('/'),tf.blue.map(pi=>pshort(pi)).join('/'));
    }).join('')}`:
    `<div style="font-size:8px;color:${G};letter-spacing:3px;margin-bottom:7px;text-transform:uppercase">Live Rangliste</div>
    ${flight.map(pi=>({pi,pts:getStb(pi),g:getGross(pi),h:getHoles(pi)})).sort((a,b)=>b.pts-a.pts).map((p,rank)=>`<div style="display:flex;justify-content:space-between;padding:3px 0;font-size:11px;align-items:center">
      <span style="color:#3a5a3a;width:16px">${rank+1}.</span>
      <span style="flex:1;color:${PC[p.pi]}">${pname(p.pi)}</span>
      <span style="color:#5a7a5a;font-size:10px;margin-right:8px">🏌️${p.g||'–'} ⛳${p.h}/18</span>
      <span style="color:${G};font-weight:700">${p.pts} Pkt</span>
    </div>`).join('')}`;

  const finBtn=flight.every(pi=>getHoles(pi)===18)||(fmt==='greensomes'&&RD.greenScores&&Object.values(RD.greenScores).every(gs=>(gs.red||[]).filter(s=>s>0).length===18&&(gs.blue||[]).filter(s=>s>0).length===18))?
    `<button id="fin-round" style="width:100%;padding:12px;background:linear-gradient(135deg,#5b8fd4,#3a5898);border:none;border-radius:11px;color:#fff;font-size:14px;font-weight:700;cursor:pointer;font-family:inherit;margin-bottom:12px">🏆 Runde abschließen</button>`:'';

  return `<div style="position:sticky;top:0;z-index:20;background:rgba(8,18,10,.97);backdrop-filter:blur(12px);border-bottom:1px solid ${BOR}">
    <div style="display:flex;justify-content:space-between;align-items:center;padding:9px 13px">
      <button id="back-setup" style="background:none;border:none;color:${G};font-size:20px;cursor:pointer;padding:4px 8px;font-family:inherit">←</button>
      <div style="text-align:center">
        <div style="font-size:8px;color:#4a6a4a;letter-spacing:3px">LOCH</div>
        <div style="font-size:28px;font-weight:700;color:${G};line-height:1">${curHole+1}</div>
        <div style="font-size:8px;color:#4a6a4a">Par ${holePar} · R${RD.roundNum} · ${FL[fmt]}</div>
      </div>
      <button id="go-res" style="background:rgba(212,168,67,.10);border:1px solid rgba(212,168,67,.3);border-radius:8px;color:${G};font-size:9px;padding:5px 9px;cursor:pointer;font-family:inherit">WERTUNG</button>
    </div>
    ${flightTabs}
  </div>
  <div class="fade" style="max-width:500px;margin:0 auto;padding:10px 12px">
    ${mBar}
    ${cards}
    <div style="display:flex;gap:6px;margin:10px 0 9px">
      <button id="prev-h" style="flex:1;padding:9px;background:#0c180c;border:1px solid ${BOR};border-radius:9px;color:${curHole===0?'#1a2e1a':'#8a9a7a'};font-size:13px;cursor:${curHole===0?'default':'pointer'};font-family:inherit">← ${curHole>0?'Loch '+curHole:''}</button>
      <button id="next-h" style="flex:1;padding:9px;background:#0c180c;border:1px solid ${BOR};border-radius:9px;color:${curHole===17?'#1a2e1a':'#8a9a7a'};font-size:13px;cursor:${curHole===17?'default':'pointer'};font-family:inherit">${curHole<17?'Loch '+(curHole+2)+' →':'→'}</button>
    </div>
    <div style="background:rgba(0,0,0,.2);border-radius:12px;padding:9px;margin-bottom:11px">
      ${hGrid(0,9,'FRONT 9')}${hGrid(9,18,'BACK 9')}
      <div style="display:flex;gap:12px;justify-content:center;margin-top:5px;font-size:9px;color:#4a6a4a">
        <span><span style="display:inline-block;width:7px;height:7px;border-radius:50%;background:${G};vertical-align:middle;margin-right:3px"></span>Alle</span>
        <span><span style="display:inline-block;width:7px;height:7px;border-radius:50%;background:#5aaf7a;vertical-align:middle;margin-right:3px"></span>Teils</span>
      </div>
    </div>
    ${finBtn}
    <div style="background:rgba(0,0,0,.25);border-radius:11px;padding:10px">
      ${bottomSection}
    </div>
  </div>`;
}

// ─── RESULTS ──────────────────────────────────────────────────────────────
function buildResults(){
  const ps=players();
  const all=ps.map((_,pi)=>({pi,pts:getStb(pi),g:getGross(pi),n:getGross(pi)>0?getGross(pi)-getV(pi):0,h:getHoles(pi)})).sort((a,b)=>b.pts-a.pts);
  const medals=['🏆','🥈','🥉'];
  const rows=all.map((p,rank)=>`<div class="card" style="border:1px solid ${PC[p.pi]}33;border-left:4px solid ${PC[p.pi]};display:flex;justify-content:space-between;align-items:center">
    <div style="display:flex;align-items:center;gap:8px">
      <span style="font-size:${rank<3?20:13}px;color:${rank===0?G:rank===1?'#b0b0b0':rank===2?'#c87a4a':'#3a5a3a'};font-weight:700;width:24px">${rank<3?medals[rank]:rank+1}</span>
      <div>
        <div style="font-size:13px;color:${PC[p.pi]};font-weight:700">${pname(p.pi)}</div>
        <div style="font-size:9px;color:#4a6a4a">🏌️${p.g||'–'} Schl. · ⛳${p.h}/18</div>
      </div>
    </div>
    <div style="text-align:right"><div style="font-size:20px;font-weight:700;color:${G}">${p.pts}</div><div style="font-size:9px;color:#4a6a4a">Pkt</div></div>
  </div>`).join('');
  return `<div style="position:sticky;top:0;z-index:20;background:rgba(8,18,10,.97);backdrop-filter:blur(12px);border-bottom:1px solid ${BOR};padding:10px 16px;display:flex;justify-content:space-between;align-items:center">
    <button id="back-game" style="background:none;border:none;color:${G};font-size:20px;cursor:pointer;font-family:inherit">←</button>

// ─── EINZEL ───────────────────────────────────────────────────────────────
function buildEinzel(){
  const ps=players();
  const totals=ps.map((_,pi)=>{
    let pts=0;
    Object.values(allRounds).forEach(r=>{
      if(!r.countForEinzel)return;
      const v2=vorgabe(r.players?.[pi]?.hcp||ps[pi].hcp,r.cr,r.sr,r.pars);
      (r.scores?.[pi]||[]).forEach((s,h)=>{if(s>0)pts+=stb(s,r.pars[h],hs(v2,h));});
    });
    return pts;
  });
  // Add live current round if applicable
  const liveActive=!RD.finalized&&RD.countForEinzel;
  const livePts=ps.map((_,pi)=>liveActive?getStb(pi):0);
  const combined=ps.map((_,pi)=>({pi,saved:totals[pi],live:livePts[pi],total:totals[pi]+livePts[pi]})).sort((a,b)=>b.total-a.total);
  const medals=['🏆','🥈','🥉'];
  const rows=combined.map((p,rank)=>`<div class="card" style="border:1px solid ${PC[p.pi]}33;border-left:4px solid ${PC[p.pi]}">
    <div style="display:flex;justify-content:space-between;align-items:center">
      <div style="display:flex;align-items:center;gap:8px">
        <span style="font-size:${rank<3?20:13}px;color:${rank===0?G:rank===1?'#b0b0b0':rank===2?'#c87a4a':'#3a5a3a'};font-weight:700;width:24px">${rank<3?medals[rank]:rank+1}</span>
        <div>
          <div style="font-size:13px;color:${PC[p.pi]};font-weight:700">${pname(p.pi)}</div>
          <div style="font-size:9px;color:#4a6a4a">HCP ${ps[p.pi]?.hcp||''}</div>
        </div>
      </div>
      <div style="text-align:right"><div style="font-size:20px;font-weight:700;color:${G}">${p.total}</div><div style="font-size:9px;color:#4a6a4a">Gesamt Pkt</div></div>
    </div>
    ${liveActive&&p.live>0?`<div style="display:flex;gap:10px;margin-top:6px;padding-top:6px;border-top:1px solid #0f1e0f;font-size:10px;color:#4a6a4a;align-items:center">
      <span style="background:rgba(212,168,67,.12);color:${G};border-radius:4px;padding:1px 6px;font-size:9px">🔴 LIVE R${RD.roundNum}</span>
      <span>+${p.live} Pkt live</span>
      <span>🏌️ ${getGross(p.pi)||'–'} Schl.</span>
      <span>⛳ ${getHoles(p.pi)}/18</span>
    </div>`:''}
  </div>`).join('');
  const roundSum=[1,2,3,4,5].map(r=>{
    const rd=allRounds[r];if(!rd)return '';
    return `<div style="background:${CARD};border-radius:9px;padding:8px 11px;margin-bottom:5px;border-left:3px solid ${G}33">
      <div style="display:flex;justify-content:space-between">
        <div style="font-size:11px;color:${G};font-weight:700">Runde ${r}</div>
        <div style="font-size:9px;color:#4a6a4a">${FL[rd.format]||rd.format} · ${rd.countForEinzel?'✅':'❌'}</div>
      </div>
      <div style="font-size:9px;color:#4a6a4a;margin-top:2px">${rd.courseName||''}</div>
    </div>`;
  }).join('');
  return `${hero('EINZELWERTUNG')}
  <div class="fade" style="max-width:560px;margin:0 auto;padding:14px 13px 20px">
    ${liveActive?`<div style="background:rgba(212,168,67,.07);border:1px solid ${G}44;border-radius:9px;padding:8px 12px;margin-bottom:12px;font-size:10px;color:${G};font-weight:700">🔴 Runde ${RD.roundNum} läuft – Live-Zwischenstand</div>`:''}
    <div class="lbl">🏆 Gesamtrangliste</div>
    ${rows||'<div style="text-align:center;padding:30px;color:#3a5a3a;font-size:12px">Noch keine Runden abgeschlossen</div>'}
    <div class="lbl" style="margin-top:16px">Rundenübersicht</div>
    ${roundSum||'<div style="font-size:11px;color:#3a5a3a">Keine Runden gespeichert</div>'}
  </div>`;
}

          const stat=matchStat(RD.format,fi);
          const rN=f.red.map(pi=>pshort(pi)).join('/');

        <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px">
          ${['red','blue'].map(team=>{

                <span style="color:${PC[pi]}">${pshort(pi)}</span>

  const matchRows=(teamOv.matches||[]).map(m=>`<div class="card" style="border:1px solid #2a3a2a">
    <div style="display:flex;justify-content:space-between;font-size:9px;color:#4a6a4a;margin-bottom:8px"><span>Runde ${m.round} · ${FL[m.format]||m.format}</span><span>${m.course||''}</span></div>
    <div style="display:flex;justify-content:space-between;align-items:center">
      <span style="font-size:16px;font-weight:700;color:${RED}">🔴 ${m.redPts}</span>
      <span style="font-size:11px;color:#4a6a4a">vs</span>
      <span style="font-size:16px;font-weight:700;color:${BLUE}">${m.bluePts} 🔵</span>
    </div>
  </div>`).join('');
  return `${hero('TEAM RYDER CUP')}
  <div class="fade" style="max-width:560px;margin:0 auto;padding:14px 13px 20px">
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:14px">
      <div style="background:rgba(212,68,68,.10);border:2px solid ${RED}44;border-radius:14px;padding:14px;text-align:center">
        <div style="font-size:22px;margin-bottom:3px">🔴</div>
        <div style="font-size:12px;color:${RED};font-weight:700;margin-bottom:5px">Team Rot</div>
        <div style="font-size:34px;font-weight:700;color:${RED}">${r}</div>
        <div style="font-size:9px;color:#8a4a4a">Punkte</div>
      </div>
      <div style="background:rgba(90,122,212,.10);border:2px solid ${BLUE}44;border-radius:14px;padding:14px;text-align:center">
        <div style="font-size:22px;margin-bottom:3px">🔵</div>
        <div style="font-size:12px;color:${BLUE};font-weight:700;margin-bottom:5px">Team Blau</div>
        <div style="font-size:34px;font-weight:700;color:${BLUE}">${b}</div>
        <div style="font-size:9px;color:#4a4a8a">Punkte</div>
      </div>
    </div>
    ${bar}
    ${liveSection}
    <div class="lbl" style="margin-top:16px">Matches</div>
    ${matchRows||'<div style="text-align:center;padding:20px;color:#3a5a3a;font-size:12px">Noch keine Team-Runden abgeschlossen</div>'}
    <button id="reset-team" style="width:100%;padding:10px;background:rgba(212,68,68,.08);border:1px solid #5a2a2a;border-radius:9px;color:#d45a5a;font-size:11px;cursor:pointer;font-family:inherit;margin-top:12px">🗑 Teamwertung zurücksetzen</button>

// ─── EVENTS ───────────────────────────────────────────────────────────────
function attachEvents(){
  // Nav
  ['round','einzel','team','chat'].forEach(t=>{const el=document.getElementById('nav-'+t);if(el)el.onclick=()=>{tab=t;render();};});

  // Round selector
  [1,2,3,4,5].forEach(r=>{
    const el=document.getElementById('sr-'+r);
    if(el)el.onclick=async()=>{
      await saveRound();
      RD.roundNum=r;
      const snap=await getDoc(rndsRef(r));
      if(snap.exists())Object.assign(RD,snap.data(),{roundNum:r});
      else{RD.scores=Array.from({length:9},()=>Array(18).fill(0));RD.greenScores={};RD.finalized=false;}
      render();
    };
  });

  // Format switch with confirmation
  ['single','matchplay','fourball','greensomes'].forEach(f=>{
    const el=document.getElementById('fmt-'+f);
    if(!el)return;
    el.onclick=()=>{
      if(f===RD.format)return;
      const hasScores=RD.scores.some(ps=>ps.some(s=>s>0))||Object.values(RD.greenScores||{}).some(gs=>(gs.red||[]).some(s=>s>0));
      const fmtN={single:'Einzel',matchplay:'Match Play',fourball:'Four-Ball',greensomes:'Greensomes'};
      if(hasScores){
        const extra=f==='greensomes'||RD.format==='greensomes'?'\n\n(Greensomes nutzt gemeinsame Scores pro Paar)':'';
        if(!confirm('Zu '+fmtN[f]+' wechseln?\n\nAchtung: Scores werden gelöscht!'+extra))return;
        RD.scores=Array.from({length:9},()=>Array(18).fill(0));
        RD.greenScores={};
      }
      RD.format=f;
      if(f!=='single'){teamSetupMode=f;showTeamSetup=true;}
      saveRound();render();
    };
  });

  // Num players
  [8,9].forEach(n=>{const el=document.getElementById('np-'+n);if(el)el.onclick=()=>{sett.numPlayers=n;saveSett();render();};});

  // Player names/hcps
  for(let i=0;i<9;i++){
    const ni=document.getElementById('pn-'+i);if(ni)ni.onchange=e=>{if(!sett.players[i])sett.players[i]={name:'',hcp:18};sett.players[i].name=e.target.value;saveSett();};
    const hi=document.getElementById('ph-'+i);if(hi)hi.onblur=e=>{if(!sett.players[i])sett.players[i]={name:'',hcp:18};sett.players[i].hcp=parseFloat(String(e.target.value).replace(',','.'))||0;saveSett();render();};
  }

  // Edit teams button
  const editTeams=document.getElementById('edit-teams');
  if(editTeams)editTeams.onclick=()=>{teamSetupMode=RD.format;showTeamSetup=true;render();};

  // Team setup overlay
  const tsCancel=document.getElementById('ts-cancel');
  if(tsCancel)tsCancel.onclick=()=>{showTeamSetup=false;render();};

  const tsSaveMP=document.getElementById('ts-save-mp');
  if(tsSaveMP)tsSaveMP.onclick=()=>{
    const flights=[];
    for(let fi=0;fi<4;fi++){
      const r=document.getElementById('mp-r-'+fi);
      const b=document.getElementById('mp-b-'+fi);
      if(r&&b)flights.push({red:parseInt(r.value),blue:parseInt(b.value)});
    }
    teamCfg.matchplay={flights};saveTeamCfg();showTeamSetup=false;render();
  };

  const tsSaveFB=document.getElementById('ts-save-fb');
  if(tsSaveFB)tsSaveFB.onclick=()=>{
    const fmt=tsSaveFB.dataset.fmt;
    const flights=[];
    for(let fi=0;fi<2;fi++){
      const r0=document.getElementById('fb-r-'+fi+'-0');
      const r1=document.getElementById('fb-r-'+fi+'-1');
      const b0=document.getElementById('fb-b-'+fi+'-0');
      const b1=document.getElementById('fb-b-'+fi+'-1');
      if(r0&&r1&&b0&&b1)flights.push({red:[parseInt(r0.value),parseInt(r1.value)],blue:[parseInt(b0.value),parseInt(b1.value)]});
    }
    teamCfg[fmt]={flights};saveTeamCfg();showTeamSetup=false;render();
  };

  // Einzel checkbox
  const chkE=document.getElementById('chk-e');if(chkE)chkE.onclick=()=>{RD.countForEinzel=!RD.countForEinzel;saveRound();render();};

  // Course picker
  const cpTog=document.getElementById('cp-tog');if(cpTog)cpTog.onclick=()=>{cpOpen=!cpOpen;render();};
  COURSES.forEach((c,i)=>{const el=document.getElementById('cp-'+i);if(el)el.onclick=()=>{RD.courseName=c.name;RD.cr=c.cr;RD.sr=c.slope;if(c.name!=='Manuell')RD.pars=c.par.slice();cpOpen=false;saveRound();render();};});

  // Start round
  const startBtn=document.getElementById('start-btn');if(startBtn)startBtn.onclick=()=>{screen='game';curHole=0;curFlight=0;render();};

  // Back buttons
  const backSetup=document.getElementById('back-setup');if(backSetup)backSetup.onclick=()=>{screen='setup';render();};
  const backGame=document.getElementById('back-game');if(backGame)backGame.onclick=()=>{screen='game';render();};
  const goRes=document.getElementById('go-res');if(goRes)goRes.onclick=()=>{screen='results';render();};

  // Flight tabs
  getFlights().forEach((_,fi)=>{const el=document.getElementById('ft-'+fi);if(el)el.onclick=()=>{curFlight=fi;render();};});

  // Score buttons – all players in current flight
  const flights=getFlights();const af=Math.min(curFlight,flights.length-1);
  const flightPis=flights[af]||[];
  flightPis.forEach(pi=>{
    [1,2,3,4,5,6,7,8,9].forEach(qv=>{
      const el=document.getElementById('q-'+pi+'-'+qv);
      if(el)el.onclick=()=>{RD.scores[pi][curHole]=qv;saveRound();render();};
    });
  });

  // Greensomes team score buttons
  if(RD.format==='greensomes'){
    const tf=getTeamFlights();const fi2=Math.min(curFlight,tf.length-1);
    if(!RD.greenScores)RD.greenScores={};
    if(!RD.greenScores[fi2])RD.greenScores[fi2]={red:Array(18).fill(0),blue:Array(18).fill(0)};
    ['red','blue'].forEach(team=>{
      [1,2,3,4,5,6,7,8,9].forEach(qv=>{
        const el=document.getElementById('gs-'+team+'-'+qv);
        if(el)el.onclick=()=>{
          if(!RD.greenScores)RD.greenScores={};
          if(!RD.greenScores[fi2])RD.greenScores[fi2]={red:Array(18).fill(0),blue:Array(18).fill(0)};
          RD.greenScores[fi2][team][curHole]=qv;saveRound();render();
        };
      });
    });
  }

  // Nav holes
  const prevH=document.getElementById('prev-h');if(prevH)prevH.onclick=()=>{if(curHole>0){curHole--;render();}};
  const nextH=document.getElementById('next-h');if(nextH)nextH.onclick=()=>{if(curHole<17){curHole++;render();}};
  for(let h=0;h<18;h++){const el=document.getElementById('hd-'+h);if(el)el.onclick=()=>{curHole=h;render();};}

  // Finish round
  const finBtn=document.getElementById('fin-round');if(finBtn)finBtn.onclick=()=>{screen='results';render();};

  // Save & finalize
  const saveFin=document.getElementById('save-fin');
  if(saveFin)saveFin.onclick=async()=>{
    RD.finalized=true;RD.players=dc(sett.players);
    await saveRound();
    allRounds[RD.roundNum]=dc(RD);
    // Team points if team format
    if(RD.format!=='single'){
      const tf=getTeamFlights();const fmt=RD.format;
      let totalR=0,totalB=0;
      tf.filter(f=>f.red.length&&f.blue.length).forEach((f,fi)=>{
        const stat=matchStat(fmt,fi);
        // Convert holes won to match points (1 per hole won, 0.5 per half)
        let r=0,b=0;
        stat.res.forEach(rs=>{if(rs==='red')r++;else if(rs==='blue')b++;else if(rs==='half'){r+=0.5;b+=0.5;}});
        const tot=r+b||1;
        totalR+=r/tot;totalB+=b/tot;
      });
      // Normalize to full match points
      const matchPts=tf.filter(f=>f.red.length&&f.blue.length).length;
      const scaleR=totalR,scaleB=totalB;
      if(!teamOv.matches)teamOv.matches=[];
      teamOv.matches=teamOv.matches.filter(m=>m.round!==RD.roundNum);
      teamOv.matches.push({round:RD.roundNum,format:RD.format,course:RD.courseName,redPts:parseFloat(scaleR.toFixed(1)),bluePts:parseFloat(scaleB.toFixed(1))});
      teamOv.red=parseFloat(teamOv.matches.reduce((s,m)=>s+m.redPts,0).toFixed(1));
      teamOv.blue=parseFloat(teamOv.matches.reduce((s,m)=>s+m.bluePts,0).toFixed(1));
      await saveTeamOv();
    }
    screen='setup';render();
    alert('✅ Runde '+RD.roundNum+' gespeichert!');
  };

  // Team reset
  const resetTeam=document.getElementById('reset-team');
  if(resetTeam)resetTeam.onclick=()=>{if(confirm('Teamwertung zurücksetzen?')){teamOv={red:0,blue:0,matches:[]};saveTeamOv();render();}};

  // Chat
  const cn=document.getElementById('cn');if(cn)cn.onclick=()=>{const s=document.getElementById('sn');if(s?.value){myName=s.value;localStorage.setItem('jga-name',myName);render();}};
  const chname=document.getElementById('chname');if(chname)chname.onclick=()=>{myName='';localStorage.removeItem('jga-name');render();};
  TAGS.forEach(t=>{const id='tag-'+t.replace(/[^a-z0-9]/gi,'-');const el=document.getElementById(id);if(el)el.onclick=()=>{selTag=selTag===t?'':t;render();};});
  const cimg=document.getElementById('cimg');
  if(cimg)cimg.onchange=e=>{
    const file=e.target.files?.[0];if(!file)return;
    const reader=new FileReader();
    reader.onload=ev=>{const img=new Image();img.onload=()=>{const c=document.createElement('canvas');const max=500;let w=img.width,h=img.height;if(w>max){h=h*(max/w);w=max;}if(h>max){w=w*(max/h);h=max;}c.width=w;c.height=h;c.getContext('2d').drawImage(img,0,0,w,h);chatImg=c.toDataURL('image/jpeg',.65);const prev=document.getElementById('imgprev');if(prev)prev.innerHTML=`<img src="${chatImg}" style="max-height:70px;border-radius:6px;border:1px solid ${BOR}"><button onclick="chatImg=null;document.getElementById('imgprev').innerHTML=''" style="margin-left:6px;background:none;border:none;color:#d45a5a;cursor:pointer;font-size:16px">✕</button>`;};img.src=ev.target.result;};reader.readAsDataURL(file);
  };
  const sendBtn=document.getElementById('send');
  if(sendBtn)sendBtn.onclick=async()=>{
    if(!myName){alert('Bitte erst deinen Namen wählen!');return;}
    const inp=document.getElementById('ci');const text=(inp?.value||'').trim();
    if(!text&&!chatImg)return;
    try{await addDoc(chatCol,{author:myName,text,tag:selTag,img:chatImg||null,ts:serverTimestamp()});if(inp)inp.value='';chatImg=null;selTag='';const prev=document.getElementById('imgprev');if(prev)prev.innerHTML='';render();}catch(e){alert('Fehler: '+e.message);}
  };
}

// ─── INIT ─────────────────────────────────────────────────────────────────
async function init(){
  try{
    const[ss,ts,rs,tv]=await Promise.all([getDoc(settRef),getDoc(teamCfgRef),getDoc(rndsRef(1)),getDoc(teamOvRef)]);
    if(ss.exists())Object.assign(sett,ss.data());
    if(ts.exists())Object.assign(teamCfg,ts.data());
    if(rs.exists())Object.assign(RD,rs.data(),{roundNum:1});
    if(tv.exists())Object.assign(teamOv,tv.data());
    // Load all rounds for einzel leaderboard
    for(let i=1;i<=5;i++){const snap=await getDoc(rndsRef(i));if(snap.exists())allRounds[i]=snap.data();}
    render();
  }catch(e){
    document.getElementById('app').innerHTML=`<div style="display:flex;align-items:center;justify-content:center;min-height:100vh;flex-direction:column;gap:12px;color:#d45a5a;font-size:13px;padding:20px;text-align:center"><div style="font-size:36px">⚠️</div>Verbindungsfehler:<br>${e.message}</div>`;
  }
}
init();
</script>
