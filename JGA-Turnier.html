function vg(hcp,cr,sr,pars){return Math.round(hcp*(sr/113)+(cr-pars.reduce(function(a,b){return a+b;},0)));}
function hs(v,hh){var a=Math.abs(v),s=v>=0?1:-1;return(SI[hh]<=Math.floor(a)?1:0)*s+(SI[hh]===1&&a>Math.floor(a)?s:0);}
function stb(s,par,rec){return s>0?Math.max(0,par-(s-rec)+2):0;}
function dc(o){return JSON.parse(JSON.stringify(o));}
function pname(sett,pi){return (sett.players[pi]&&sett.players[pi].name)||'?';}
function pshort(sett,pi){return pname(sett,pi).split(' ')[0].slice(0,8);}
function pc(pi){return PC[pi]||G;}
function getV(sett,RD,pi){return vg((sett.players[pi]&&sett.players[pi].hcp)||18,RD.cr,RD.sr,RD.pars);}
function getStb(sett,RD,pi){var sc=RD.scores&&RD.scores[pi]||[];return sc.reduce(function(sum,s,hh){return sum+(s>0?stb(s,(RD.pars&&RD.pars[hh])||4,hs(getV(sett,RD,pi),hh)):0);},0);}
function getGross(RD,pi){var sc=RD.scores&&RD.scores[pi]||[];return sc.reduce(function(a,s){return a+(s||0);},0);}
function getHoles(RD,pi){var sc=RD.scores&&RD.scores[pi]||[];return sc.filter(function(s){return s>0;}).length;}

function getFlights(n){
  if(n<=4)return [[0,1,2,3].slice(0,n)];
  if(n<=6)return [[0,1,2],[3,4,5]];
  if(n<=8)return [[0,1,2,3],[4,5,6,7]];
  return [[0,1,2],[3,4,5],[6,7,8]];
}
function getTeamFlights(teamCfg,fmt){
  if(fmt==='matchplay'){
    return ((teamCfg.matchplay&&teamCfg.matchplay.flights)||[]).map(function(fl){return {red:[fl.red],blue:[fl.blue]};});
  }
  var key=fmt==='fourball'?'fourball':'greensomes';
  return ((teamCfg[key]&&teamCfg[key].flights)||[]).map(function(fl){return {red:fl.red||[],blue:fl.blue||[]};});
}
function getDisplayFlights(sett,teamCfg,RD){
  if(RD.format==='single')return getFlights(sett.numPlayers);
  var tf=getTeamFlights(teamCfg,RD.format);
  if(!tf.length)return getFlights(sett.numPlayers);
  return tf.map(function(f){return f.red.concat(f.blue);});
}

function calcMatch(sett,RD,teamCfg,rPis,bPis,fi){
  var res=[],up=0,played=0,fmt=RD.format;
  for(var hh=0;hh<18;hh++){
    var rNet=null,bNet=null;
    if(fmt==='greensomes'){
      var gs=RD.greenScores&&RD.greenScores[fi];
      var rs=gs&&gs.red&&gs.red[hh],bs=gs&&gs.blue&&gs.blue[hh];
      if(!rs||!bs){res.push(null);continue;}
      var rV=rPis.reduce(function(s,pi){return s+getV(sett,RD,pi);},0)/Math.max(rPis.length,1);
      var bV=bPis.reduce(function(s,pi){return s+getV(sett,RD,pi);},0)/Math.max(bPis.length,1);
      rNet=rs-Math.round(hs(rV,hh));bNet=bs-Math.round(hs(bV,hh));
    } else if(fmt==='matchplay'){
      var rpi=rPis[0],bpi=bPis[0];
      var rs2=RD.scores[rpi]&&RD.scores[rpi][hh],bs2=RD.scores[bpi]&&RD.scores[bpi][hh];
      if(!rs2||!bs2){res.push(null);continue;}
      rNet=rs2-hs(getV(sett,RD,rpi),hh);bNet=bs2-hs(getV(sett,RD,bpi),hh);
    } else {
      rPis.forEach(function(pi){var s=RD.scores[pi]&&RD.scores[pi][hh];if(!s)return;var n=s-hs(getV(sett,RD,pi),hh);if(rNet===null||n<rNet)rNet=n;});
      bPis.forEach(function(pi){var s=RD.scores[pi]&&RD.scores[pi][hh];if(!s)return;var n=s-hs(getV(sett,RD,pi),hh);if(bNet===null||n<bNet)bNet=n;});
      if(rNet===null||bNet===null){res.push(null);continue;}
    }
    played++;
    if(rNet<bNet){up++;res.push('red');}
    else if(bNet<rNet){up--;res.push('blue');}
    else res.push('half');
  }
  return {up:up,remaining:18-played,played:played,res:res,won:Math.abs(up)>18-played};
}

function MatchBar(props){
  var stat=props.stat,rName=props.rName,bName=props.bName;
  var up=stat.up,rem=stat.remaining,won=stat.won;

  if(up!==0){var abs=Math.abs(up),nm=up>0?rName:bName;col=up>0?RED:BLUE;txt=won?nm+' '+abs+'&'+rem:nm+' '+abs+' UP';}
  return h('div',{style:{background:'rgba(0,0,0,.3)',borderRadius:'10px',padding:'9px 11px',marginBottom:'8px'}},
    h('div',{style:{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:'5px'}},

      h('span',{style:{fontSize:'13px',fontWeight:'700',color:col,flex:'1',textAlign:'center'}},txt),
      h('span',{style:{fontSize:'12px',color:BLUE,fontWeight:'700'}},bName+' 🔵')
    ),
    h('div',{style:{display:'flex',gap:'3px',flexWrap:'wrap'}},
      stat.res.map(function(r,i){return h('span',{key:i,style:{display:'inline-block',width:'9px',height:'9px',borderRadius:'50%',background:r===null?'#1a2e1a':r==='red'?RED:r==='blue'?BLUE:'#4a6a4a'}});})

    h('div',{style:{fontSize:'9px',color:'#4a6a4a',marginTop:'3px',textAlign:'center'}},stat.played+' gespielt \u00b7 '+rem+' verbleibend')
  );
}

                  var nc=Object.assign({},teamCfg,{matchplay:{flights:flights}});setTeamCfg(nc);saveTCfg(nc);setShowTS(false);
                },style:{flex:'2',padding:'12px',background:'linear-gradient(135deg,'+G+',#a07830)',border:'none',borderRadius:'10px',color:'#050d05',fontWeight:'700',fontFamily:'inherit',cursor:'pointer'}},'✓ Speichern')
              )
            )
          : h('div',null,
              h('div',{style:{fontSize:'11px',color:'#4a6a4a',marginBottom:'12px'}},'2 Flights · je 2 Rot + 2 Blau'),
              (((tsF==='fourball'?teamCfg.fourball:teamCfg.greensomes)||{flights:[{red:[0,1],blue:[4,5]},{red:[2,3],blue:[6,7]}]}).flights||[]).slice(0,2).map(function(fl,fi){
                return h('div',{key:fi,style:{background:'rgba(0,0,0,.3)',borderRadius:'10px',padding:'10px',marginBottom:'8px'}},
                  h('div',{style:{fontSize:'10px',color:G,marginBottom:'8px',letterSpacing:'2px'}},'FLIGHT '+(fi+1)),
                  h('div',{style:{display:'grid',gridTemplateColumns:'1fr 1fr',gap:'10px'}},
                    ['red','blue'].map(function(team){
                      return h('div',{key:team},
                        h('div',{style:{fontSize:'9px',color:team==='red'?RED:BLUE,marginBottom:'5px'}},team==='red'?'🔴 ROT':'🔵 BLAU'),
                        [0,1].map(function(si){
                          return h('select',{key:si,id:'fb2-'+team+'-'+fi+'-'+si,defaultValue:String((fl[team]||[])[si]||0),style:{width:'100%',background:'#0c180c',border:'1px solid '+(team==='red'?RED:BLUE)+'55',borderRadius:'7px',color:team==='red'?RED:BLUE,padding:'6px',fontFamily:'inherit',fontSize:'11px',marginBottom:'4px'}},
                            Array.from({length:n2},function(_,i){return h('option',{key:i,value:String(i),selected:(fl[team]||[])[si]===i},pname(sett,i));})
                          );
                        })
                      );
                    })
                  )
                );
              }),
              h('div',{style:{display:'flex',gap:'8px',marginTop:'14px'}},
                h('button',{onClick:function(){setShowTS(false);},style:{flex:'1',padding:'12px',background:'#0c180c',border:'1px solid '+BOR,borderRadius:'10px',color:'#8a9a7a',fontFamily:'inherit',cursor:'pointer'}},'Abbrechen'),
                h('button',{onClick:function(){
                  var key2=tsF==='fourball'?'fourball':'greensomes';
                  var flights=[];
                  for(var fi=0;fi<2;fi++){
                    var r0=document.getElementById('fb2-red-'+fi+'-0'),r1=document.getElementById('fb2-red-'+fi+'-1');
                    var b0=document.getElementById('fb2-blue-'+fi+'-0'),b1=document.getElementById('fb2-blue-'+fi+'-1');
                    if(r0&&r1&&b0&&b1)flights.push({red:[parseInt(r0.value),parseInt(r1.value)],blue:[parseInt(b0.value),parseInt(b1.value)]});
                  }
                  var nc2=dc(teamCfg);nc2[key2]={flights:flights};setTeamCfg(nc2);saveTCfg(nc2);setShowTS(false);
                },style:{flex:'2',padding:'12px',background:'linear-gradient(135deg,'+G+',#a07830)',border:'none',borderRadius:'10px',color:'#050d05',fontWeight:'700',fontFamily:'inherit',cursor:'pointer'}},'✓ Speichern')
              )
            )
      )
    );
  }

  // End of buildGame try block handled in render error boundary
  var content=null;
  if(tab==='round'){
    if(screen==='setup')content=buildSetup();
    else if(screen==='game')content=buildGame();
    else content=buildResults();
  } else if(tab==='einzel'){content=buildEinzel();}
  else if(tab==='team'){content=buildTeam();}
  else {content=buildChat();}

  try{
    return h('div',{id:'appwrap',style:{background:BG,minHeight:'100vh'}},content,showTS&&buildTeamSetup(),navEl);
  }catch(e){
    return h('div',{style:{padding:'20px',color:'#d45a5a',background:BG,minHeight:'100vh',fontFamily:'monospace',fontSize:'12px'}},
      h('div',{style:{fontSize:'20px',marginBottom:'10px'}},'⚠️ Fehler'),
      h('div',null,String(e.message)),
      h('div',{style:{marginTop:'10px',fontSize:'10px',color:'#4a6a4a'}},String(e.stack||'').slice(0,300))
    );
  }
}

ReactDOM.createRoot(document.getElementById('root')).render(React.createElement(App));
})();
</script>
</body>
</html>
